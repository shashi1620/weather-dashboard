<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="weather-app">
        <h1>🌦️ Weather Dashboard</h1>
        <p>Frontend test — Git collaboration demo</p>

        <form id="searchForm">
            <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off" required />
            <button type="submit">Search</button>
        </form>

        <p id="loading" class="message" hidden>Loading demo data...</p>
        <p id="errorMessage" class="message error" role="alert"></p>

        <section id="weatherContainer" class="weather-container">
            <div class="location">
                <h2 id="cityName">Bengaluru</h2>
                <p id="countryName">India</p>
            </div>

            <div class="weather-main">
                <div class="weather-icon" id="weatherIcon">🌤️</div>
                <div>
                    <div class="temperature">
                        <span id="temperature">28</span>°C
                    </div>
                    <p id="weatherDescription">Partly cloudy (demo)</p>
                </div>
            </div>

            <div class="weather-details">
                <div class="weather-card">
                    <span class="label">Humidity</span>
                    <strong><span id="humidity">65</span>%</strong>
                </div>
                <div class="weather-card">
                    <span class="label">Wind Speed</span>
                    <strong><span id="windSpeed">12</span> km/h</strong>
                </div>
                <div class="weather-card">
                    <span class="label">Latitude</span>
                    <strong id="latitude">12.9716</strong>
                </div>
                <div class="weather-card">
                    <span class="label">Longitude</span>
                    <strong id="longitude">77.5946</strong>
                </div>
            </div>

            <div class="api-info">
                <p>Demo data updated: <span id="weatherTime">--</span></p>
                <p><small>Demo only — not live weather information.</small></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
